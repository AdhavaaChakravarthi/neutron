name: CI

on:
  push:
  pull_request:

jobs:
  model-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model reference checks
        working-directory: tools/model-reference
        run: python3 check_model.py
