name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Behavioural checks
        working-directory: tools/model-reference
        run: python3 check_model.py
      - name: Golden vectors are up to date
        working-directory: tools/model-reference
        run: python3 make_golden.py --check

  android:
    needs: model-reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace :model:test :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease 2>&1 | tee build.log

      # Job logs aren't readable from the build workspace, so failures are also posted as annotations.
      - name: Explain a failure
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|> Task .* FAILED" build.log | head -8 | while IFS= read -r line; do echo "::error::${line}"; done
          grep -E " STARTED$" build.log | tail -3 | while IFS= read -r line; do echo "::error::last started: ${line}"; done
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          out = []
          for path in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              for tc in ET.parse(path).getroot().iter("testcase"):
                  for f in tc.findall("failure") + tc.findall("error"):
                      msg = (f.get("message") or f.text or "")[:400].replace("\n", " ")
                      out.append(f"TEST {tc.get('classname')}.{tc.get('name')}: {msg}")
          for path in glob.glob("app/build/reports/lint-results*.xml"):
              for i in ET.parse(path).getroot().iter("issue"):
                  if i.get("severity") in ("Error", "Fatal"):
                      loc = i.find("location")
                      where = f"{loc.get('file')}:{loc.get('line')}" if loc is not None else ""
                      out.append(f"LINT {i.get('id')}: {(i.get('message') or '')[:250]} at {where}")
          for line in out[:40]:
              print("::error::" + line)
          EOF

      - name: Count tests
        id: tests
        run: |
          python3 - <<'EOF' > tests.txt
          import glob, xml.etree.ElementTree as ET
          def count(pattern):
              total = bad = 0
              for path in glob.glob(pattern):
                  r = ET.parse(path).getroot()
                  total += int(r.get("tests")); bad += int(r.get("failures")) + int(r.get("errors"))
              return total - bad, total
          mp, mt = count("model/build/test-results/test/*.xml")
          ap, at = count("app/build/test-results/testReleaseUnitTest/*.xml")
          print(f"Tests passed: model {mp}/{mt}, app {ap}/{at}")
          EOF
          cat tests.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo "summary=$(cat tests.txt)" >> "$GITHUB_OUTPUT"

      - name: APK must not ask for network access
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::INTERNET permission found in the APK"
            exit 1
          fi

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "commander-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: commander-apk
          path: commander-*.apk

      - name: Keep reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "**/build/reports/**"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v0.2.${{ github.run_number }}" "commander-${{ github.run_number }}.apk" app/build/screenshots/*.png app/schemas/*/*.json \
            --target "${{ github.sha }}" \
            --title "Commander 0.2.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. ${{ steps.tests.outputs.summary }}. No network permission. On your phone: download the APK, open it, allow the install."
